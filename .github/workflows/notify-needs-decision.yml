# 無人モード(backlog Routine)の判断待ちをメール通知につなげるワークフロー。
#
# GitHub は「自分自身の操作」を通知しないため、Routine があなたのアカウントで
# 作った Issue / PR はそのままでは通知されない。github-actions bot という
# 別のアクターから assign / @メンションを行うことで Participating 通知(メール)を
# 発生させる。運用ドキュメント: docs/automation/backlog-routine.md の「通知」節。

name: Notify needs-decision

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  # Issue に needs-decision が付いたら、リポジトリオーナーを assign して @メンションする
  notify-judgment-issue:
    if: github.event_name == 'issues' && github.event.label.name == 'needs-decision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [owner] });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `@${owner} あなたの判断が必要です。本文の「判断してほしいこと」を確認してください。`,
            });

  # PR が作られたらオーナーを assign する。Draft/通常を問わない(自分のアカウントで
  # 作られた PR は GitHub が通知しないため、bot の assign でメール通知を発生させる)
  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              assignees: [owner],
            });

  # PR がマージされずにクローズされたら、その PR が Closes していた open Issue の
  # 着手中ロック(status:in-progress)を解除する。これをしないとロックが残り、
  # ready-to-implement な Issue が全部ロック済みになって Routine が毎 fire スキップする
  # (docs/automation/backlog-routine.md「ゴミロックの自動回収」節)。
  # コメントは投稿しない(assignee への Participating 通知を防ぐ。ラベル遷移は
  # Issue タイムラインに残るため追跡可能。#290)。
  unlock-in-progress-on-pr-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const LOCK = 'status:in-progress';
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set();
            let m;
            while ((m = re.exec(pr.body ?? '')) !== null) numbers.add(Number(m[1]));
            for (const issue_number of numbers) {
              let issue;
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number })).data;
              } catch {
                continue;
              }
              if (issue.state !== 'open') continue;
              const hasLock = (issue.labels ?? []).some(
                (l) => (typeof l === 'string' ? l : l.name) === LOCK,
              );
              if (!hasLock) continue;
              await github.rest.issues
                .removeLabel({ owner, repo, issue_number, name: LOCK })
                .catch(() => {});
            }

  # PR がマージ/クローズされたら、対応するマージ判断 Issue を自動クローズする。
  # assignee を先に外してからクローズし、コメントは投稿しない(Participating
  # 通知を防ぐ。クローズ理由 completed/not_planned と Issue タイムラインで
  # 追跡可能。#290)。
  close-merge-judgment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const marker = `<!-- merge-judgment-pr: ${pr.number} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'needs-decision',
              per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!(issue.body ?? '').includes(marker)) continue;
              const assignees = (issue.assignees ?? []).map((a) => a.login);
              if (assignees.length > 0) {
                await github.rest.issues.removeAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees,
                });
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: pr.merged ? 'completed' : 'not_planned',
              });
            }
