name: CI

on:
  push:
    branches: [main]
  pull_request:
  # バックログが静かな週は push/PR が発生せず、新しい advisory で
  # `pnpm audit` が落ちる状態などに次の PR まで気づけない。週1回 main を
  # 検証し、既存の notify-main-failure をそのまま検知網として使う。
  # cron は UTC 表記(月曜 06:00 JST 相当)。
  schedule:
    - cron: '0 21 * * 0'
  # auto-revert-main-failure が GITHUB_TOKEN で作った revert PR の CI を明示的に
  # 起動するためのトリガー。GITHUB_TOKEN による push/PR 作成はイベントを発火しない
  # (GitHub Actions 全般の再帰防止仕様)が、workflow_dispatch だけはこの制限の
  # 例外として GITHUB_TOKEN でも新しい実行を作れる(#739)。
  workflow_dispatch:

# 同じ PR に push が続いたとき、追い越された run を捨てて実行枠の空費を防ぐ。
#
# main への push はマージ後の履歴を検証する唯一の機会なので、commit ごとに
# 別グループへ分けて取りこぼさない。グループを ref で共有すると main への push が
# 全て同じグループに入り、cancel-in-progress: false でも「待機中」の run は
# 後から来た run に捨てられる(この設定が守るのは実行中の run だけ、という
# GitHub の仕様)。実績として #494 / #500 / #503 のマージ後 CI が連続マージで
# 全て cancelled になり、main が赤いことに約 11 時間気づけなかった。
#
# schedule も同じ sha キーの分岐に乗る(pull_request 以外は github.sha)。
# schedule 実行時の github.sha は main の最新 commit と一致するため、直近の
# push run と同じグループ名になりうるが、両者が同時に走ることはなく
# (schedule は週1回、push は commit ごと)、キャンセルではなく前の run の
# 完了待ちで済む。ref 共有時の「取りこぼし」問題はここには生じない。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 通常は 8 分前後で終わる。倍以上かかっているものは無限待ちとみなし、
    # 既定の 6 時間を待たずに打ち切って実行枠を守る。
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warimaru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # 変更パスで後段の検証を出し分ける。docs / skills だけの変更でも
      # Playwright まで含めて 1 run 8 分を使い切っており(実測)、
      # マージ実績の約半数がその種の変更だったため段階を設けた。
      #
      # 判定できないときは必ず「全部実行」に倒す。検証を飛ばす条件を
      # 積極的に満たしにいくと、判定の不具合がそのまま検証漏れになるため。
      - name: Detect changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          run_all() {
            echo "::notice::変更パスを判定できなかったため全ての検証を実行する(${1})"
            {
              echo 'code=true'
              echo 'web=true'
            } >>"${GITHUB_OUTPUT}"
            exit 0
          }

          # push(main へのマージ)・schedule(週次の定期検証)は常に全部。
          # main の状態そのものの検証は省かない。
          [ "${GITHUB_EVENT_NAME}" = 'pull_request' ] || run_all 'pull_request 以外のイベント'

          # checkout は深さ 1 のため、比較の基点だけを追加で取得する。
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" 2>/dev/null || run_all '基点の取得に失敗'
          files="$(git diff --name-only "${BASE_SHA}" HEAD)" || run_all '差分の取得に失敗'
          [ -n "${files}" ] || run_all '変更ファイルが空'

          # code: ビルド・型・テスト・lint を要する変更
          # web : 画面の見た目が変わりうる変更(視覚回帰テストを要する)
          code=false
          web=false
          while IFS= read -r file; do
            case "${file}" in
              docs/* | .claude/* | *.md) ;;
              packages/web/*)
                code=true
                web=true
                ;;
              # domain は web が dist 経由で参照するため、画面表示にも波及しうる。
              packages/domain/*)
                code=true
                web=true
                ;;
              *) code=true ;;
            esac
          done <<<"${files}"

          echo '変更ファイル:'
          echo "${files}" | sed 's/^/  /'
          echo "判定: code=${code} web=${web}"
          {
            echo "code=${code}"
            echo "web=${web}"
          } >>"${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v4
        # バージョンは package.json の packageManager フィールドから解決される

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.scope.outputs.code == 'true'
        run: pnpm build

      # Build 直後に置く理由: out/ を読むだけで数秒しかかからず、初期表示の肥大化は
      # 早く気づくほど原因の特定が容易なため。予算の根拠と超過時の判断は
      # docs/review/bundle-budget.md に記録する。
      - name: Bundle size budget (web)
        # Build と同じ実行条件にする。計測対象の packages/web/out/ は Build が作るため、
        # Build がスキップされる差分でこのステップだけ走ると出力が無く失敗する。
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @warimaru/web bundle-size

      - name: Typecheck
        if: steps.scope.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.scope.outputs.code == 'true'
        run: pnpm test

      - name: Integration test (adapters-postgres)
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @warimaru/adapters-postgres test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/warimaru_test

      # ブラウザ本体(約 150MB)は毎回ダウンロードすると 30 秒以上かかる。
      # 依存が変わらない限り中身は同じなのでロックファイルを鍵に持ち回す。
      - name: Cache Playwright browsers
        if: steps.scope.outputs.code == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.scope.outputs.code == 'true'
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # キャッシュが効いたときもブラウザの動作に必要な OS 側の依存だけは入れ直す
          # (これはランナー側の状態でキャッシュの対象外のため)。
          if [ "${CACHE_HIT}" = 'true' ]; then
            pnpm --filter @warimaru/web exec playwright install-deps chromium
          else
            pnpm --filter @warimaru/web exec playwright install --with-deps chromium
          fi
          pnpm --filter @warimaru/e2e exec playwright install chromium

      - name: Visual regression tests (Playwright)
        if: steps.scope.outputs.web == 'true'
        run: pnpm --filter @warimaru/web test:e2e

      - name: Upload VRT diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vrt-results
          path: packages/web/test-results/
          retention-days: 30

      - name: E2E smoke tests
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @warimaru/e2e test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/warimaru_test

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: e2e/test-results/
          retention-days: 30

      - name: Lint
        if: steps.scope.outputs.code == 'true'
        run: pnpm lint

      # 失敗基準を moderate にしている理由: 個人の金融データを扱うため既知脆弱性を放置したくなく、
      # かつ導入時点で moderate 以上を 0 件にできたため high へ緩める必要がなかった。
      # low は対応不能な情報系指摘が混ざり CI が慢性的に赤くなるため採らない。
      # 除外は `|| true` ではなく package.json の pnpm.auditConfig.ignoreGhsas で宣言し、
      # 対象・理由・再評価時期を docs/review/dependency-audit.md に記録する。
      # build / test より後段に置く理由: 上流の advisory 公開だけで落ちうるため、
      # 前段に置くと他の検証結果すら得られなくなる。
      # 変更パスによらず必ず実行する理由: 上流の advisory 公開は自分の変更と無関係に
      # 起きるため、docs だけの変更のときに検知の機会を落とす意味がない(実測 1 秒)。
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      # prettier は docs / skills の Markdown も対象なので必ず実行する。
      - name: Format check
        run: pnpm format:check

  # main の CI が失敗したことを人に届ける。失敗時の既存の仕掛けはアーティファクト
  # 収集だけで、赤くなっても通知は一切飛ばなかった(実績: #508 のマージ後 CI が
  # failure のまま約 11 時間放置され、その間に出た PR 5 件が巻き添えで赤くなった)。
  #
  # notify-needs-decision.yml には任せられない。GITHUB_TOKEN による操作は他の
  # ワークフローを起動しない GitHub の仕様があり、ここで作った Issue では
  # issues: labeled が発火しないため。同じ狙い(assign + @メンションで
  # Participating 通知=メールを起こす)をこの job の中で行う。
  #
  # 無人モードが PR を自分でマージするようになったため(マージゲート)、マージ前に
  # 人間が目視する機会はもう無い。この job が立てる Issue は「main が壊れたことに
  # 気づく最後の砦」なので、needs-decision を付けて /decide のアジェンダにも載せる。
  notify-main-failure:
    needs: verify
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARKER = '<!-- main-ci-failure -->';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.slice(0, 8);
            // schedule には head_commit が無いため、push とは別に起因を明示する。
            const trigger = context.eventName === 'schedule' ? '週次の定期実行' : 'push';
            const subject =
              context.eventName === 'push' ? (context.payload.head_commit?.message ?? '').split('\n')[0] : '';
            const detail = [
              `- 起因: ${trigger}`,
              `- コミット: ${shortSha} ${subject}`.trimEnd(),
              `- 失敗した run: ${runUrl}`,
            ].join('\n');

            // 赤が続く間に報告 Issue が増えないよう、open の報告があれば作り直さず
            // 追記する。ラベルではなく本文の目印で引き当てる(close-merge-judgment と
            // 同じやり方。ラベルを新設せずに済む)。
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (i) => !i.pull_request && (i.body ?? '').includes(MARKER),
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `main がまだ赤いままです。\n\n${detail}`,
              });
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title: `[main 赤] main の CI が失敗しています (${shortSha})`,
              body: [
                MARKER,
                `main に対する CI(${trigger})が失敗しました。CI は「main と合体させた状態」を検証するため、`,
                '**この状態が続く限り以降の全ての PR が同じ失敗で赤くなります**。優先して直してください。',
                '',
                '## 失敗した run',
                '',
                detail,
                '',
                '## 進め方',
                '',
                '1. 上の run のログで失敗しているステップを特定する',
                '2. 修正の PR を出す(main へ直接 push しない)',
                '3. マージ後に main の CI が緑へ戻ったことを確認し、この Issue を閉じる',
                '',
                '無人モードは fire ごとに main の CI を確認し、赤い間はマージも新規着手も',
                '行わない(赤い main の上に PR を積み増さないため)。つまりバックログの',
                '消化はこれが直るまで止まる。',
              ].join('\n'),
              labels: ['needs-decision'],
            });
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: created.number,
              assignees: [owner],
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: created.number,
              body: `@${owner} main の CI が失敗しています。放置すると以降の PR が全て赤くなるため、優先して確認してください。`,
            });

  # main を壊したコミットの revert PR を自動作成し、復旧を forward-fix より速くする
  # (#508 は人間が needs-decision に気づくまで約11時間かかった)。対象は push
  # イベントのみ(schedule の失敗は「壊した1コミット」を指せないため revert できない)。
  #
  # GITHUB_TOKEN で作った PR には push/pull_request イベントが自動発火しない
  # (GitHub Actions の再帰防止仕様)。このジョブが workflow_dispatch を明示的に
  # 起動することで CI を回す(Issue #739 の決定: 案 A)。
  auto-revert-main-failure:
    needs: [verify, notify-main-failure]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target commit and branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          BRANCH="revert/main-failure-${SHORT_SHA}"
          SUBJECT="$(git log -1 --format=%s "${SHA}")"
          # squash マージの PR タイトルは末尾に (#NNN) を含む(このリポジトリの
          # マージ方式は squash に統一されている)。無ければ元 PR は不明のまま進める。
          ORIG_PR="$(echo "${SUBJECT}" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+' || true)"

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "branch=${BRANCH}"
            echo "subject=${SUBJECT}"
            echo "orig_pr=${ORIG_PR}"
          } >>"${GITHUB_OUTPUT}"

          # 冪等性: 同じコミットに対する revert PR が既に open なら何もしない
          existing="$(gh pr list --state open --head "${BRANCH}" --json number --jq 'length')"
          if [ "${existing}" != '0' ]; then
            echo "::notice::${BRANCH} 向けの revert PR が既に open のため何もしない"
            echo 'skip=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'skip=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Attempt revert
        id: revert
        if: steps.target.outputs.skip == 'false'
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          SHA="${{ steps.target.outputs.sha }}"
          git switch -c "${{ steps.target.outputs.branch }}"

          # squash マージは通常1親だが、念のため親数を見て通常マージ(2親)にも対応する。
          PARENTS="$(git show -s --format=%P "${SHA}" | wc -w)"
          if [ "${PARENTS}" -gt 1 ]; then
            REVERT_OK=0
            git revert --no-edit -m 1 "${SHA}" && REVERT_OK=1
          else
            REVERT_OK=0
            git revert --no-edit "${SHA}" && REVERT_OK=1
          fi

          if [ "${REVERT_OK}" = '1' ]; then
            echo 'conflict=false' >>"${GITHUB_OUTPUT}"
          else
            git revert --abort 2>/dev/null || true
            echo 'conflict=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Push revert branch
        if: steps.target.outputs.skip == 'false' && steps.revert.outputs.conflict == 'false'
        run: git push origin "${{ steps.target.outputs.branch }}"

      - name: Create revert PR
        id: pr
        if: steps.target.outputs.skip == 'false' && steps.revert.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.target.outputs.subject }}
          SHORT_SHA: ${{ steps.target.outputs.short_sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
          ORIG_PR: ${{ steps.target.outputs.orig_pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'main 復旧のための自動 revert PR です(`notify-main-failure` / `auto-revert-main-failure` ジョブ、Issue #739)。'
            echo ''
            echo '## 対象'
            echo ''
            echo "- 元コミット: ${SHORT_SHA} ${SUBJECT}"
            if [ -n "${ORIG_PR}" ]; then
              echo "- 元 PR: #${ORIG_PR}"
            fi
            echo "- 失敗した run: ${RUN_URL}"
            echo ''
            echo 'CI が green になればマージゲート経由でマージされます。revert 後に元 PR の対応が'
            echo '必要な場合(仕様変更として正しい変更だった場合など)は、原因を直した別 PR を'
            echo '出してください。'
          } >body.md

          gh pr create \
            --title "revert: main 復旧のための自動 revert (${SHORT_SHA})" \
            --body-file body.md \
            --base main \
            --head "${BRANCH}"

      - name: Trigger CI for revert branch
        if: steps.target.outputs.skip == 'false' && steps.revert.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ steps.target.outputs.branch }}"

      - name: Report revert conflict on main-red issue
        if: steps.target.outputs.skip == 'false' && steps.revert.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ steps.target.outputs.short_sha }}
          SUBJECT: ${{ steps.target.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state open --json number,body --limit 100 \
            --jq '[.[] | select(.body != null and (.body | contains("<!-- main-ci-failure -->")))][0].number')"
          if [ -z "${issue_number}" ] || [ "${issue_number}" = 'null' ]; then
            echo '::warning::main 赤 Issue が見つからず、revert コンフリクトのコメントを残せなかった'
            exit 0
          fi
          {
            echo '自動 revert がコンフリクトしたため、revert PR は作成しませんでした。手動で対処してください。'
            echo ''
            echo "- 対象コミット: ${SHORT_SHA} ${SUBJECT}"
            echo "- 失敗した run: ${RUN_URL}"
          } >comment.md
          gh issue comment "${issue_number}" --body-file comment.md
