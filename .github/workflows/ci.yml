name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warimaru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # バージョンは package.json の packageManager フィールドから解決される

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration test (adapters-neon)
        run: pnpm --filter @warimaru/adapters-neon test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/warimaru_test

      - name: Install Playwright browsers
        run: |
          pnpm --filter @warimaru/web exec playwright install --with-deps chromium
          pnpm --filter @warimaru/e2e exec playwright install chromium

      - name: Visual regression tests (Playwright)
        run: pnpm --filter @warimaru/web test:e2e

      - name: Upload VRT diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vrt-results
          path: packages/web/test-results/
          retention-days: 30

      - name: E2E smoke tests
        run: pnpm --filter @warimaru/e2e test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/warimaru_test

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: e2e/test-results/
          retention-days: 30

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
