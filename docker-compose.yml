# ローカル統合テスト用 PostgreSQL（Neon 互換の素の postgres:16）
# 使い方:
#   docker compose up -d db
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/warimaru_test \
#     pnpm --filter @warimaru/adapters-neon test:integration
#
# データは永続化しない（エフェメラル）: テスト専用 DB のため、
# マイグレーション再生成時にローカルの journal 残留と CI（毎回フレッシュ）で
# 挙動が割れるのを防ぐ。リセットは `docker compose down && docker compose up -d db`。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warimaru_test
    ports:
      # dev 専用 DB のため loopback のみにバインド
      - '127.0.0.1:5432:5432'
